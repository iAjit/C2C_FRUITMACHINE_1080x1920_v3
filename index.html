              // to force the browser engine to start downloading immediately.
              var videoSrc = videoElement.src || gwdVideoComponent.getAttribute("sources") || gwdVideoComponent.getAttribute("src");

              if (videoSrc && (!videoElement.src || videoElement.src === "")) {
                videoElement.src = videoSrc;
              }

              // Force a physical file reload stream right now
              videoElement.load();

              // Run an initial manual calculation pass in case .load() forces an instant cache hit
              runProgressCalculation();
            }

          } else {
            console.error("Found component, but could not target the inner video element layer.");
          }
        } else {
          console.error("Could not find element ID 'Video003' outside the function.");
        }

        function checkVioohReady() {
          if (vioohReadySent) return;

          // SCENARIO A: Fallback mode (No asset ID or store found)
          //var isFallbackMode = (fallbackImage.style.opacity === "1" || fallbackImage.style.opacity === 1);

          if (isFallbackMode) {
            if (calculationsComplete) {
              vioohReadySent = true;

              console.log("Fallback Mode: Calculations complete. Sending ready signal immediately.");
              videoElement.removeEventListener("progress", runProgressCalculation);
              videoElement.removeEventListener("canplaythrough", runProgressCalculation);
              videoElement.removeEventListener("loadeddata", runProgressCalculation);
              videoElement.removeEventListener("loadedmetadata", runProgressCalculation);
              videoElement.style.display = "none";
              fallbackImage.style.display = "block";
              console.log('VIOOH Ready event triggered');
              window.parent.postMessage({
                event: "viooh.ready"
              }, "*");
              //triggerPlay(); 
            }
          }
          // SCENARIO B: Standard Video mode (Asset ID found, MUST wait for video download)
          else {
            if (calculationsComplete && videoLoaded) {
              vioohReadySent = true;
              videoElement.style.display = "block";
              fallbackImage.style.display = "none";
              console.log("Standard Mode: Both calculations and video download are 100% ready.");
              console.log('VIOOH Ready event triggered');
              window.parent.postMessage({
                event: "viooh.ready"
              }, "*");
              //triggerPlay(); 
            }
          }
        }

        //DYNAMIC Calculations
        var userLatitude;
        var userLongitude;

        var qs = new URLSearchParams(window.location.search);
        var vioohAssetId = qs.get("viooh_asset_id");
        //vioohAssetId = '1234934296';
        //var infoElement = document.getElementById('info');
        //infoElement.innerHTML = '<p>Asset ID: ' + vioohAssetId + '</p>';        

        // console.log("Sheet data : " + frameListData);
        if (frameListData) {
          var locationData = {};
          // console.log("sheet data length: " + frameListData.length);
          for (var i = 0; i < frameListData.length; i++) {
            var row = frameListData[i];
            //  console.log("sheet data: " + frameListData[i]);
            locationData[row["Frame ID"]] = {
              lat: parseFloat(row["Lat"]),
              lon: parseFloat(row["Long"])
            };
          }
        }
        if (vioohAssetId && frameListData) {
          if (locationData[vioohAssetId]) {
            userLatitude = locationData[vioohAssetId].lat;
            userLongitude = locationData[vioohAssetId].lon;
            console.log(`DOOH Frame Location → Lat: ${userLatitude}, Long: ${userLongitude}`);
          }
        }

        fetchLocation();

        function fetchLocation() {
          // console.log("Fetch Location called");
          if (userLatitude && userLongitude) {
            var currentLat = userLatitude;
            var currentLon = userLongitude;
            var nearestStore = null;
            var minDistance = Infinity;
            var minTime = Infinity;
            for (var i = 0; i < locationListData.values.length; i++) {
              var store = locationListData.values[i];
              var storeID = store["Store"];
              var storeName = store["Message"];
              var storeLat = parseFloat(store["Latitude"]);
              var storeLon = parseFloat(store["Longitude"]);
              var distance = getDistanceFromLatLonInKm(currentLat, currentLon, storeLat, storeLon);
              // console.log("Distance Calculated: " + distance);

              if (distance < minDistance) {
                minDistance = distance;
                nearestStore = {
                  name: storeName,
                  add: storeID,
                  lat: storeLat,
                  lon: storeLon
                };
              }
            }
            //console.log(nearestStore);
            if (nearestStore) {
              console.log('Nearest Store:', nearestStore.name);
              console.log('Distance:', minDistance.toFixed(2), 'km');
              var walkingTime = calculateWalkingTime(minDistance, 5);
              var roundedDown = Math.ceil(walkingTime);
              console.log('Walking Time: ', walkingTime.toFixed(2), ' minutes');
              const containerStoreName = document.getElementById('nearstoreName');
              const storeName = nearestStore.name;
              //storeName = 'Fenchurch Street - Only use tickets and discounts youre entitled to.'
              const parts = storeName.split(" - ");

              containerStoreName.innerHTML = `<span style="font-family: FSAlbert-Bold;">${parts[0]}</span>  <span style="font-family: FSAlbert-Regular;"> - ${parts.slice(1).join(" - ")}</span>`;
              // containerStoreName.innerHTML = `${nearestStore.name}`;
              // containerStoreName.style.fontFamily = 'FSAlbert-Regular';
            }
          } else {
            console.log('vioohAssetId Not found. Activating fallback Image layout. Disabling the Video Mode');
            const containerStoreName = document.getElementById('nearstoreName');
            containerStoreName.innerHTML = ` `;

            // 1. Show fallback image and pause the hidden video player

            if (videoElement) {
              videoElement.pause();
              videoElement.style.display = "none";
            }

            // 2. Keep this FALSE so the standard video path doesn't get tricked.
            // Scenario A in checkVioohReady() will handle this automatically now.
            videoLoaded = false;
            isFallbackMode = true;
          }

          // ==============================
          // Calculations Finished
          // ==============================
          calculationsComplete = true;
          console.log("Dynamic calculations completed.");
          checkVioohReady();
        }

        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
          var R = 6371;
          var dLat = deg2rad(lat2 - lat1);
          var dLon = deg2rad(lon2 - lon1);
          var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
          var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
          var d = R * c;
          return d;
        }

        function deg2rad(deg) {
          return deg * (Math.PI / 180);
        }

        function calculateWalkingTime(distanceInKm, walkingSpeed = 5) {
          // Default walking speed is 5 km/h, but you can adjust it as needed.
          var timeInHours = distanceInKm / walkingSpeed;
          var timeInMinutes = timeInHours * 60;
          return timeInMinutes;
        }

        function triggerPlay() {
          //console.log('Play event triggered');
          // console.log("Init ad called");
          //gwdAd.initAd();
          console.log("triggerPlay videoElement : " + videoElement);
          console.log("triggerPlay isFallbackMode : " + isFallbackMode);
          if (videoElement && !isFallbackMode) {
            videoElement.play();
          }

        }
        window.addEventListener('message', function(event) {
          if (event.data.event === 'viooh.play') {
            console.log("viooh.play Event");
            triggerPlay();
          }
        }, false);

      }

      /**
       * Handles the WebComponentsReady event. This event is fired when all
       * custom elements have been registered and upgraded.
       */
      function handleWebComponentsReady(event) {


        // Start the Ad lifecycle.
        requestAnimationFrame(function() {
          setTimeout(function() {
            // GWD's original initialization line (keep this active)
            console.log("Init ad called");
            gwdAd.initAd();
          }, 1);
        });
      }

      /**
       * Handles the event that is dispatched after the Ad has been
       * initialized and before the default page of the Ad is shown.
       */
      function handleAdInitialized(event) {}

      window.addEventListener('DOMContentLoaded',
        handleDomContentLoaded, false);
      window.addEventListener('WebComponentsReady',
        handleWebComponentsReady, false);
      window.addEventListener('adinitialized',
        handleAdInitialized, false);
    })();
